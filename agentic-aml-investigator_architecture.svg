<svg xmlns="http://www.w3.org/2000/svg" width="680" height="492" viewBox="0 0 680 492" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Architecture of the agentic AML investigator with per-agent tool wiring</title>
<desc>Streamlit UI feeds a LangGraph orchestrator of five agents. Triage's risk tier branches the flow: low-risk cases skip the investigator (fast path); medium and high-risk take the deep path. Triage calls the ML risk scorer, Investigate calls the investigation tools, and Planner, Narrate and Review call Claude. A guardrail and audit ledger form a governance layer across the graph.</desc>
<style>
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="250" y="30" width="180" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="50" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Streamlit UI</text>
<line x1="340" y1="70" x2="340" y2="96" stroke="#8a8984" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="98" width="600" height="120" rx="14" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="52" y="114" dominant-baseline="central" fill="#6f6e69">LangGraph orchestrator</text>

<text class="ts" x="332" y="130" text-anchor="middle" fill="#6f6e69">low-risk fast path</text>
<path d="M218 150 L218 138 L446 138 L446 150" fill="none" stroke="#8a8984" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<rect x="52" y="150" width="104" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="104" y="172" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Planner</text>
<rect x="166" y="150" width="104" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="218" y="172" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Triage</text>
<rect x="280" y="150" width="104" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="332" y="172" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Investigate</text>
<rect x="394" y="150" width="104" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="446" y="172" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Narrate</text>
<rect x="508" y="150" width="104" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="560" y="172" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Review</text>

<line x1="156" y1="172" x2="166" y2="172" stroke="#8a8984" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="270" y1="172" x2="280" y2="172" stroke="#8a8984" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="384" y1="172" x2="394" y2="172" stroke="#8a8984" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="498" y1="172" x2="508" y2="172" stroke="#8a8984" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="332" y="209" text-anchor="middle" fill="#6f6e69">deep path: med / high risk</text>

<path d="M218 194 L218 250" fill="none" stroke="#8a8984" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M332 194 L332 250" fill="none" stroke="#8a8984" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M446 194 L446 334" fill="none" stroke="#8a8984" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M104 194 L104 360 L168 360" fill="none" stroke="#8a8984" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M560 194 L560 360 L512 360" fill="none" stroke="#8a8984" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<rect x="153" y="250" width="130" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="218" y="269" text-anchor="middle" dominant-baseline="central" fill="#085041">ML risk scorer</text><text class="ts" x="218" y="287" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">iforest + logit</text>
<rect x="267" y="250" width="130" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="332" y="269" text-anchor="middle" dominant-baseline="central" fill="#085041">Investigation tools</text><text class="ts" x="332" y="287" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">lookup · watchlist</text>

<rect x="170" y="336" width="340" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="340" y="354" text-anchor="middle" dominant-baseline="central" fill="#085041">Claude LLM</text><text class="ts" x="340" y="372" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">plan · write · review</text>

<text class="ts" x="340" y="404" text-anchor="middle" fill="#6f6e69">governance layer — spans the whole graph</text>
<rect x="95" y="418" width="210" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text class="th" x="200" y="436" text-anchor="middle" dominant-baseline="central" fill="#633806">Guardrail</text><text class="ts" x="200" y="454" text-anchor="middle" dominant-baseline="central" fill="#854F0B">high-risk needs human</text>
<rect x="375" y="418" width="210" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="480" y="436" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Audit ledger</text><text class="ts" x="480" y="454" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">every step logged</text>
</svg>
